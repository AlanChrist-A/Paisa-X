# WHAT: runs Kafka, Redis, Prometheus and Grafana in Docker. `uv run paisa up` starts them for you.
# WHY: Kafka carries Paisa-X events to later consumers (features, data lake, demo page).
# START: docker compose up -d      STOP (frees RAM): docker compose down
# CAREFUL: one broker means no copies of data. Production uses at least 3 brokers.

services:
  kafka:
    image: apache/kafka:4.1.1  # Official Apache image, pinned so every run is the same.
    container_name: paisa-kafka  # Fixed name, so drills can stop and restart it.
    ports:
      - "127.0.0.1:9092:9092"  # CAREFUL: only this laptop can connect, not the network.
    mem_limit: 800m  # Hard RAM cap for the whole container.
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"  # Java memory for Kafka itself.
      KAFKA_NODE_ID: 1  # This broker's ID.
      KAFKA_PROCESS_ROLES: broker,controller  # KRaft mode: one process stores data AND manages the cluster, so no ZooKeeper.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093  # Port for apps, port for cluster management.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092  # Address clients are told to use.
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER  # Which listener is for management.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT  # No TLS, because it is local only.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093  # The only voter is this broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1  # Only one broker, so one copy.
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1  # Same reason.
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1  # Same reason.
      KAFKA_MIN_INSYNC_REPLICAS: 1  # acks=all means "this one broker" here.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0  # Consumers start at once.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # CAREFUL: a typo in a topic name fails loudly instead of creating a new topic.

  redis:
    image: redis:7.4-alpine  # Official image, pinned.
    container_name: paisa-redis  # Fixed name, so drills can find it.
    ports:
      - "127.0.0.1:6379:6379"  # CAREFUL: only this laptop can connect.
    mem_limit: 64m  # Hard RAM cap for the container.
    # 48 MB for data. "noeviction" refuses writes when full instead of silently deleting features.
    # No snapshots to disk: Redis holds only fast state, which can be rebuilt from Kafka.
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]

  # --- Phase 9: monitoring. Prometheus collects numbers; Grafana draws them. ---
  prometheus:
    image: prom/prometheus:v3.1.0  # Official image, pinned.
    container_name: paisa-prometheus
    ports:
      - "127.0.0.1:9090:9090"  # CAREFUL: only this laptop can connect.
    mem_limit: 150m  # Hard RAM cap.
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Lets Linux reach the apps on the host too (Docker Desktop has it already).
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro  # What to scrape.
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]  # Keep 2 days only.

  grafana:
    image: grafana/grafana:11.4.0  # Official image, pinned.
    container_name: paisa-grafana
    ports:
      - "127.0.0.1:3000:3000"  # Open http://127.0.0.1:3000 in a browser.
    mem_limit: 200m  # Hard RAM cap.
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # View dashboards without logging in (local only).
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer  # Anonymous users can look, not change.
      GF_ANALYTICS_REPORTING_ENABLED: "false"  # No usage data sent out.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/paisa.json  # Opens straight on our dashboard.
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro  # Data source and dashboard list, set up automatically.
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro  # The dashboard itself.
